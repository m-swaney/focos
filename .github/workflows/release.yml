name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: uv python install 3.13
      - run: uv lock
      - run: uv venv .venv --python 3.13 && uv pip install --python .venv -e ".[dev,all]" && uv run --python .venv python -m pytest -q
      - run: uv run --python .venv python scripts/private_scan.py --no-local
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: dashboard
      - run: uv run --python .venv python scripts/build_release.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/focos-*.zip
            dist/focos-*.zip.sha256
          generate_release_notes: true
